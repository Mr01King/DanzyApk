<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Auto Crop Resi Blueprint</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #ffffff; padding: 12px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #1e293b; max-width: 420px; width: 100%; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
    h2 { font-size: 1.1rem; text-align: center; margin-bottom: 12px; color: #38bdf8; }
    
    .btn-upload {
      background: #0284c7; color: white; padding: 14px; text-align: center;
      border-radius: 8px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 12px;
      font-size: 1rem;
    }
    .preview-wrap {
      background: #000; border: 1px solid #475569; border-radius: 8px;
      padding: 8px; display: flex; justify-content: center; align-items: center;
      min-height: 220px; margin-bottom: 12px;
    }
    canvas { max-width: 100%; height: auto; max-height: 350px; background: white; }
    
    button {
      border: none; padding: 14px; border-radius: 8px; font-weight: bold;
      font-size: 1rem; cursor: pointer; width: 100%;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .btn-direct { background: #10b981; color: white; }
    .btn-direct:active { background: #059669; }

    .status { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Auto-Crop Resi Langsung Cetak</h2>

  <label class="btn-upload" for="fileInput">
    📁 1. PILIH RESI (PDF / FOTO)
    <input type="file" id="fileInput" accept="application/pdf,image/*" style="display:none">
  </label>

  <div class="preview-wrap">
    <canvas id="cvsMain" width="600" height="900"></canvas>
  </div>

  <!-- Tombol Langsung Kirim ke Aplikasi Cetak -->
  <button class="btn-direct" id="btnShare" onclick="sendDirectToApp()" disabled>
    🚀 2. LANGSUNG KIRIM KE PRINTER
  </button>

  <div class="status" id="txtStatus">Pilih dokumen resi terlebih dahulu</div>
</div>

<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const cvs = document.getElementById('cvsMain');
  const ctx = cvs.getContext('2d');
  const txtStatus = document.getElementById('txtStatus');
  const btnShare = document.getElementById('btnShare');

  let srcCanvas = document.createElement('canvas');
  let srcCtx = srcCanvas.getContext('2d');
  let isReady = false;

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    txtStatus.innerText = 'Memotong area kosong otomatis...';

    if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      const page = await pdf.getPage(1);
      
      const vp = page.getViewport({ scale: 1.5 });
      srcCanvas.width = vp.width;
      srcCanvas.height = vp.height;

      await page.render({ canvasContext: srcCtx, viewport: vp }).promise;
    } else {
      await new Promise(res => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            srcCanvas.width = img.width;
            srcCanvas.height = img.height;
            srcCtx.drawImage(img, 0, 0);
            res();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    isReady = true;
    renderOptimized();
  });

  function detectBounds(sCtx, w, h) {
    const imgData = sCtx.getImageData(0, 0, w, h);
    const d = imgData.data;
    let minX = w, minY = h, maxX = 0, maxY = 0, found = false;

    for (let y = 0; y < h; y += 4) {
      for (let x = 0; x < w; x += 4) {
        const i = (y * w + x) * 4;
        if ((d[i] + d[i+1] + d[i+2]) / 3 < 200 && d[i+3] > 50) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          found = true;
        }
      }
    }
    if (!found) return { x: 0, y: 0, w: w, h: h };
    const pad = 8;
    return {
      x: Math.max(0, minX - pad),
      y: Math.max(0, minY - pad),
      w: Math.min(w, maxX + pad) - Math.max(0, minX - pad),
      h: Math.min(h, maxY + pad) - Math.max(0, minY - pad)
    };
  }

  function renderOptimized() {
    if (!isReady) return;

    cvs.width = 600;
    cvs.height = 900;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    let box = detectBounds(srcCtx, srcCanvas.width, srcCanvas.height);
    let autoRot = (cvs.height >= cvs.width && box.w > box.h) ? 90 : 0;

    ctx.save();
    ctx.translate(cvs.width / 2, cvs.height / 2);
    ctx.rotate((autoRot * Math.PI) / 180);

    const isRot90 = (autoRot === 90);
    const effW = isRot90 ? box.h : box.w;
    const effH = isRot90 ? box.w : box.h;

    const scale = Math.min((cvs.width - 32) / effW, (cvs.height - 32) / effH);
    const dw = box.w * scale;
    const dh = box.h * scale;

    ctx.drawImage(srcCanvas, box.x, box.y, box.w, box.h, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();

    // Binarisasi kontras hitam-putih
    const idata = ctx.getImageData(0, 0, cvs.width, cvs.height);
    const d = idata.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) < 155 ? 0 : 255;
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(idata, 0, 0);

    // Border tipis untuk deteksi tepi printer
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, cvs.width - 2, cvs.height - 2);

    btnShare.disabled = false;
    txtStatus.innerText = 'Selesai dipotong! Klik tombol hijau di bawah.';
  }

  // Mengirim file langsung via Share Sheet Android
  function sendDirectToApp() {
    cvs.toBlob(async (blob) => {
      const file = new File([blob], 'resi_siap_cetak.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Cetak Resi',
            text: 'Cetak ke printer thermal'
          });
        } catch (e) {}
      } else {
        // Fallback jika WebView memblokir share sheet
        const link = document.createElement('a');
        link.download = 'resi_siap_cetak.jpg';
        link.href = cvs.toDataURL('image/jpeg', 0.70);
        link.click();
        txtStatus.innerText = 'Tersimpan otomatis. Buka aplikasi Blueprint.';
      }
    }, 'image/jpeg', 0.70);
  }
</script>
</body>
</html>
